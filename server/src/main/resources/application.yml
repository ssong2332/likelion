server:
  port: 8080

spring:
  profiles:
    include: local
  application:
    name: manyfast-server
  datasource:
    url: ${DB_URL:jdbc:h2:mem:manyfast;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL:update}
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  api-url: https://api.openai.com/v1/chat/completions

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

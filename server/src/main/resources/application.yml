server:
  port: 8080

spring:
  application:
    name: manyfast-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  api-url: https://api.openai.com/v1/chat/completions

cors:
  allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:3000"

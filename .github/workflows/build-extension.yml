name: Build Chrome Extension

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'client/sai-extension/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/sai-extension/package.json

      - name: Install Extension Dependencies
        run: |
          cd client/sai-extension
          npm install

      - name: Build Extension
        run: |
          cd client/sai-extension
          npm run build

      - name: Zip dist Folder
        run: |
          cd client/sai-extension/dist
          zip -r ../sai-extension-dist.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sai-extension-dist
          path: client/sai-extension/sai-extension-dist.zip
          retention-days: 30
